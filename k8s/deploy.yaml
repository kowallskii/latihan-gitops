apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-poinpik
spec:
  replicas: 2
  selector:
    matchLabels:
      # PENTING: Label ini harus sesuai dengan selector di Service Anda
      app: exercise3 
  template:
    metadata:
      labels:
        app: exercise3
    spec:
      containers:
      - name: nginx-container
        # Gunakan tag image terbaru dari hasil build Jenkins Anda
        image: canda22/poinpik-apps:22
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: service-exercise3
spec:
  type: NodePort
  selector:
    app: exercise3
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 32323
