apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-poinpik
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx-container
        image: nginx:stable
        ports:
        - containerPort: 80
