apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-poinpik
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exercise3
  template:
    metadata:
      labels:
        app: exercise3
    spec:
      containers:
      - name: nodejs-container  # Diubah dari nginx-container agar lebih deskriptif
        image: canda22/poinpik-apps:25
        ports:
        - containerPort: 3000   # WAJIB 3000 karena Node.js app.js dengerin port 3000
---
apiVersion: v1
kind: Service
metadata:
  name: service-exercise3
spec:
  type: NodePort
  selector:
    app: exercise3
  ports:
    - protocol: TCP
      port: 80         # Port yang diakses dari dalam cluster/load balancer
      targetPort: 3000 # Harus sama dengan containerPort di atas
      nodePort: 32323  # Port yang kamu akses via IP Node (misal: http://192.168.x.x:32323)
